name: Deploy VitePress (GitHub Pages + CloudBase)

on:
  push:
    branches: [master]      # 你的默认分支是 master
  workflow_dispatch:        # 支持在 Actions 页手动重跑

permissions:
  contents: read
  pages: write              # GitHub Pages 部署所需
  id-token: write           # GitHub Pages OIDC 所需

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ---------- 1. 构建（只跑一次）----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 供 VitePress lastUpdated

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm docs:build   # 产物：docs/.vitepress/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Upload dist for CloudBase
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: docs/.vitepress/dist
          retention-days: 1

  # ---------- 2. 部署到 GitHub Pages（并行）----------
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------- 3. 部署到 CloudBase /blog（并行）----------
  deploy-cloudbase:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login (CI 非交互)
        run: tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy to CloudBase static hosting (/blog)
        run: tcb hosting deploy dist /blog -e ${{ secrets.TCB_ENV_ID }} --yes
